<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <script src="app.js" defer></script>
</head>

<body>
    <h1>My To-Do List</h1>

    <section id="signupPanel">
        <h2>Join your to-do list</h2>
        <form id="signupForm">
            <label for="userName">Name</label>
            <input id="userName" name="name" type="text" autocomplete="name" required>
            <label for="userEmail">Email</label>
            <input id="userEmail" name="email" type="email" autocomplete="email" required>
            <button type="submit">Join</button>
        </form>
        <p id="signupError" role="alert"></p>
    </section>

    <section id="todoApp" hidden>
        <p id="welcomeMessage"></p>
        <input id="taskInput" type="text" placeholder="Task name">
        <textarea id="descriptionInput" placeholder="Task description"></textarea>
        <input id="deadlineInput" type="date">
        <button onclick="addTask()">Add Task</button>

        <h2>Your Tasks</h2>
        <ul id="taskList"></ul>
    </section>

</body>
</html>
